<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<meta name="description" content="A plain daily to-do list. A clean page every morning.">
<meta name="theme-color" content="#ede4d3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-v3.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192-v3.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v3.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Cinzel:wght@400..700&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=IM+Fell+English:ital@0;1&family=Inter+Tight:wght@400..700&family=JetBrains+Mono:wght@400..700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800;1,6..12,400..800&family=Pinyon+Script&family=Space+Mono:wght@400;700&family=Unbounded:wght@400..900&display=swap">
<link rel="stylesheet" href="ledger.css">
<script>
  // colour the window's title bar for the saved theme before anything else loads, so it never flashes
  try {
    const s = JSON.parse(localStorage.getItem('ledger-v1')), t = s && s.settings && s.settings.theme;
    const c = { aero: '#2164f5', cyber: '#070709', dark: '#0e0905', light: '#ede4d3' }[t];
    if (c) document.querySelector('meta[name=theme-color]').content = c;
  } catch (e) {}
</script>
</head>
<body data-theme="light" data-layout="right">
<div id="art" aria-hidden="true"></div>
<div class="titlebar-drag" aria-hidden="true"></div>
<main class="stage">
  <aside class="brand" id="brand"></aside>
  <section class="panel" id="panel" aria-label="Today"></section>
  <aside class="side" id="side"></aside>
</main>
<script type="module" src="ledger.js"></script>
</body>
</html>
