name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build MouseBatteryTray/MouseBatteryTray.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: MouseBatteryTray
          path: MouseBatteryTray/bin/Release/net48/MouseBatteryTray.exe
